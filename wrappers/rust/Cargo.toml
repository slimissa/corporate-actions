[package]
name = "corporate-actions"
version = "1.0.0"
edition = "2021"
description = "Rust wrapper for the Corporate Actions Registry (actions.json)"
license = "Apache-2.0"
authors = ["QuantOS Project <contact@quantos.org>"]
repository = "https://github.com/slimissa/corporate-actions"
homepage = "https://github.com/slimissa/corporate-actions"
documentation = "https://docs.rs/corporate-actions"
readme = "README.md"
keywords = ["corporate-actions", "finance", "registry", "splits", "dividends", "quant"]
categories = ["finance", "parser-implementations"]

[lib]
name = "corporate_actions_registry"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# No extra dev-dependencies needed; tests use std only.

[profile.release]
lto = true
codegen-units = 1