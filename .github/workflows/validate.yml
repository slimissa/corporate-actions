name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Actual validation tool: tools/validate.py against the fixtures.
  # This is the canonical registry check. It must pass before any release.
  # ---------------------------------------------------------------------
  validator:
    name: Registry validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema

      - name: Verify fixtures are populated
        run: |
          for f in tests/fixtures/identifiers.json \
                   tests/fixtures/iso4217.json \
                   tests/fixtures/exchange_calendar.json; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty."
              echo "Populate tests/fixtures/ with valid registries before running CI."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done
      
      - name: Run validator
        run: |
          python3 tools/validate.py \
            --actions actions.json \
            --schema schema.json \
            --identifiers tests/fixtures/identifiers.json \
            --iso4217 tests/fixtures/iso4217.json \
            --exchange-calendar tests/fixtures/exchange_calendar.json \
            --min-actions 100
      
      - name: Verify build artifacts are current
        run: |
          python3 tools/build.py \
            --actions actions.json \
            --output-dir dist \
            --check
      
      - name: Reject list is valid JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('_removed_actions.json'))
          assert isinstance(d.get('removed'), list)
          print(f\"{len(d['removed'])} reject entries\")
          "

      - name: Every reject-list entry is absent from actions.json
        run: |
          python3 - <<'PY'
          import json, sys
          reject = json.load(open("_removed_actions.json"))["removed"]
          ids = {a["action_id"] for a in json.load(open("actions.json"))["actions"]}
          for r in reject:
              oid = r.get("original_action_id")
              if oid and oid in ids:
                  print(f"FAIL: reject-list entry {oid!r} present in actions.json")
                  sys.exit(1)
          print(f"OK: {len(reject)} reject entries, none present in actions.json")
          PY

  docs-facts:
    name: Docs match facts.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema rfc3339-validator
      - name: check_doc_facts
        run: python3 tools/check_doc_facts.py
      - name: check_doc_facts --scan
        run: python3 tools/check_doc_facts.py --scan
      - name: update_facts --check
        run: python3 tools/update_facts.py --check

  build-artifacts:
    name: Build artifacts match data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/build.py --actions actions.json --output-dir dist
      - run: python3 tools/build.py --actions actions.json --output-dir dist --check

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      - run: ruff check tests/ tools/ examples/ scripts/
    
  
  # ---------------------------------------------------------------------
  # Python: root tests + wrapper tests.
  # ---------------------------------------------------------------------
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Root tests
        run: pytest tests/ -v -m "not network"

      - name: Python wrapper tests
        working-directory: wrappers/python
        run: pytest tests/ -v
      
      - name: Test merge_fetched
        run: pytest tests/test_merge_fetched.py -v

      - name: Run shell tests
        run: bash tests/test_run_update.sh

      - name: Verify docs match fact sheet
        run: python3 tools/check_doc_facts.py
  # ---------------------------------------------------------------------
  # JavaScript: wrapper tests.
  # ---------------------------------------------------------------------
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        working-directory: wrappers/javascript
        run: npm test

  # ---------------------------------------------------------------------
  # Go: wrapper tests.
  # ---------------------------------------------------------------------
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run tests
        working-directory: wrappers/go
        run: go test ./registry -v

  # ---------------------------------------------------------------------
  # Rust: wrapper tests with cargo caching.
  # ---------------------------------------------------------------------
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wrappers/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wrappers/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: wrappers/rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: wrappers/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: wrappers/rust
        run: cargo test --verbose