name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validator:
    name: Registry validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema
      - name: Verify fixtures are populated
        run: |
          for f in tests/fixtures/identifiers.json \
                   tests/fixtures/iso4217.json \
                   tests/fixtures/exchange_calendar.json; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done
      - name: Reject list is valid JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('_removed_actions.json'))
          assert isinstance(d.get('removed'), list)
          print(f\"{len(d['removed'])} reject entries\")
          "
      - name: Every reject-list entry is absent from actions.json
        run: |
          python3 - <<'PY'
          import json, sys
          reject = json.load(open("_removed_actions.json"))["removed"]
          ids = {a["action_id"] for a in json.load(open("actions.json"))["actions"]}
          for r in reject:
              oid = r.get("original_action_id")
              if oid and oid in ids:
                  print(f"FAIL: reject-list entry {oid!r} present in actions.json")
                  sys.exit(1)
          print(f"OK: {len(reject)} reject entries, none present in actions.json")
          PY

  docs-facts:
    name: Docs match facts.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema rfc3339-validator
      - name: check_doc_facts
        run: python3 tools/check_doc_facts.py
      # REMOVED: duplicate "--scan" step (ran the same command)
      - name: update_facts --check
        run: python3 tools/update_facts.py --check

  build-artifacts:
    name: Build artifacts match data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/build.py --actions actions.json --output-dir dist
      - run: python3 tools/build.py --actions actions.json --output-dir dist --check

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      - run: ruff check tests/ tools/ examples/ scripts/

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Root tests
        run: pytest tests/ -v -m "not network"
      - name: Python wrapper tests
        working-directory: wrappers/python
        run: pytest tests/ -v
      # REMOVED: redundant test_merge_fetched step
      - name: Run shell tests
        run: bash tests/test_run_update.sh
      # REMOVED: redundant check_doc_facts step

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        working-directory: wrappers/javascript
        run: npm test

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - name: Run tests
        working-directory: wrappers/go
        run: go test ./registry -v

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wrappers/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wrappers/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        working-directory: wrappers/rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: wrappers/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        working-directory: wrappers/rust
        run: cargo test --verbose